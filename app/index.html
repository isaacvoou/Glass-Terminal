<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Glass Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/xterm.js"></script>
  <script defer src="vendor/addon-fit.js"></script>
  <script defer src="vendor/addon-search.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
 <main id="surface">
  <header id="titlebar">
   <div id="window-buttons">
    <button id="window-close" class="close" aria-label="Закрыть окно" title="Закрыть окно">×</button>
    <button id="window-minimize" class="minimize" aria-label="Свернуть окно" title="Свернуть">−</button>
    <button id="window-maximize" class="maximize" aria-label="Развернуть окно" title="Развернуть">□</button>
   </div>
   <nav id="tabs" role="tablist" aria-label="Вкладки"></nav>
   <button id="new-tab" class="toolbar" title="Новая вкладка" aria-label="Новая вкладка">+</button>
   <button id="show-settings" class="toolbar" title="Оформление" aria-label="Оформление">☷</button>
   <span id="drag-space" aria-hidden="true"></span>
  </header>
  <section id="terminals" aria-label="Терминал"></section>
  <form id="search" hidden autocomplete="off">
   <input id="query" type="search" placeholder="Найти в выводе" aria-label="Найти в выводе">
   <button id="previous" type="button" aria-label="Предыдущее совпадение">↑</button>
   <button type="submit" aria-label="Следующее совпадение">↓</button>
   <button id="dismiss-search" type="button" aria-label="Закрыть поиск">×</button>
  </form>
  <section id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
   <div class="settings-title"><h1 id="settings-title">Оформление</h1><button id="dismiss-settings" aria-label="Закрыть настройки">×</button></div>
   <label>Затемнение фона <output id="opacity-value"></output><input id="opacity" type="range" min="0" max="100" step="1"></label>
   <label>Радиус углов <output id="radius-value"></output><input id="radius" type="range" min="8" max="40" step="1"></label>
   <label>Размер шрифта <output id="fontSize-value"></output><input id="fontSize" type="range" min="10" max="30" step="1"></label>
   <label class="checkbox"><input id="blur" type="checkbox"> Системное размытие</label>
   <p id="blur-hint"></p>
   <p>0% затемнения — прозрачный фон без размытия. Текст сохраняет непрозрачность.</p>
  </section>
  <div id="status" role="status" hidden></div>
 </main>
</body>
</html>
