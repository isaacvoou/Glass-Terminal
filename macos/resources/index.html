<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Glass Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="terminal.css">
  <script defer src="vendor/xterm.js"></script>
  <script defer src="vendor/addon-fit.js"></script>
  <script defer src="vendor/addon-search.js"></script>
  <script defer src="terminal.js"></script>
</head>
<body>
  <div id="terminal" aria-label="Терминал"></div>
  <form id="search" hidden autocomplete="off">
    <input id="query" type="search" placeholder="Найти в выводе" aria-label="Найти в выводе">
    <button type="button" id="previous" aria-label="Предыдущее совпадение">↑</button>
    <button type="submit" aria-label="Следующее совпадение">↓</button>
    <button type="button" id="dismiss" aria-label="Закрыть поиск">×</button>
  </form>
  <div id="status" role="status" hidden></div>
</body>
</html>
